services:
  db:
    image: postgis/postgis:16-3.4
    container_name: cleanflow-db
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d cleanflow-db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - internal

  backend:
    build: .
    container_name: cleanflow-backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.cleanflow.rule=Host(`cleanflow.deyvigo.online`)"
      - "traefik.http.routers.cleanflow.entrypoints=websecure"
      - "traefik.http.routers.cleanflow.tls.certresolver=myresolver"
      - "traefik.http.services.cleanflow.loadbalancer.server.port=8080"
      - "traefik.http.routers.cleanflow-http.rule=Host(`cleanflow.deyvigo.online`)"
      - "traefik.http.routers.cleanflow-http.entrypoints=web"
      - "traefik.http.routers.cleanflow-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    networks:
      - web
      - internal

networks:
  web:
    external: true
  internal:
    driver: bridge